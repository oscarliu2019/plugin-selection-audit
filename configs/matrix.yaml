    optional: false
  - name: ILI
    tslib_data: custom
    root_path: data/illness
    data_path: national_illness.csv
    hf_path: illness/national_illness.csv
    enc_in: 7
    total_len: 966
    train_len: 676
    freq: w
    period: 52
    seq_len: 36                 # ILI 专用 look-back
    label_len: 18
    horizons: [24, 36, 48, 60]  # ILI 专用 horizon
    batch_size: 32
    use_amp: false
    tier: cheap
    optional: false
  - name: Traffic                # 单列为可选：862 通道，绝对耗时大头
    tslib_data: custom
    root_path: data/traffic
    data_path: traffic.csv
    hf_path: traffic/traffic.csv
    enc_in: 862
    total_len: 17544
    train_len: 12280
    freq: h
    period: 24
    seq_len: 96
    horizons: [96, 192, 336, 720]
    batch_size: 16              # 含 PatchTST（官方 4 → 16，见 deviations.patchtst_traffic_bs）
    use_amp: true
    tier: heavy
    optional: true              # 默认不排产；--include-optional 打开

# -----------------------------------------------------------------------------
# 剪枝规则：把「可先验判定为 no-op」的格子从排产里剪掉，只留验证子集
# -----------------------------------------------------------------------------
skip_rules:
  - id: revin_on_internal_norm_backbones
    plugin: revin
    backbone_internal_norm: hardcoded
    reason: "骨干已内含同款实例归一化，外挂 RevIN 数学上退化为 no-op（见 deviations.internal_norm_is_hardcoded）"
    keep_verification_subset:
      datasets: [ETTh1, Weather]
      horizons: [96, 720]
      seeds: [2021]

# -----------------------------------------------------------------------------
# 种子策略：全矩阵 1 seed 建主表；cheap 层补到 3 seed 用于统计检验；heavy 层永远 1 seed
# -----------------------------------------------------------------------------
seed_policy:
  base_seeds: [2021]
  extra_seeds: [2022, 2023]
  tiers_with_extra_seeds: [cheap]
  note: "Traffic/Electricity 仅 1 seed，论文中必须显式声明"

# -----------------------------------------------------------------------------
# 成本模型（先验；scheduler --probe 用 1-epoch 实测覆盖）
#   est_sec = iters_per_epoch × ms_per_iter/1000 × expected_epochs × plugin_overhead
#   ms_per_iter = dataset_base_ms × backbone.cost_factor × horizon_factor
#   horizon_factor = ((seq_len+pred_len)/(seq_len+base_pred))^backbone.horizon_cost_exponent
# -----------------------------------------------------------------------------
cost_model:
  device: "V100-32GB (fp32; AMP=fp16)"
  anchor: "VarDrop@RTX3090 ms/iter × 2.0 保守折算 + iTransformer@P100 全基准可跑的存在性证据"
  dataset_base_ms:            # iTransformer, pred_len=96 基准点
    ETTh1: 25.0
    ETTh2: 25.0
    ETTm1: 25.0
    ETTm2: 25.0
    Weather: 40.0
    Electricity: 82.0
    Exchange: 20.0
    ILI: 15.0
    Traffic: 400.0
  amp_speedup: 0.75           # 开 AMP 后 ms/iter 折扣
  expected_epochs: 8.0        # train_epochs=10 + patience=3 的期望实际 epoch 数（phase-1 实测中位 8.0 ✔）
  # 每 epoch 的 val/test 评估开销。先验拍的是 1.15，但 phase-1 的 835 格实测反解出
  # train_seconds / (iters×ms×epochs) 的中位数是 **2.22**（p90 6.86）——评估前向
  # 在长 horizon / 多通道数据集上远不止 15%。这个低估直接导致 TimesNet-h720 的
  # 单格预估只有 2.2h 而实测单 epoch 就 1.4h。无人值守要靠预估卡截止，必须用实测值。
  # 复核方式：python -m tools.calibrate_speed --from-config configs/matrix.yaml
  eval_overhead: 2.22
  probe_min_iters: 30         # 测速至少跑这么多 iter 才认为可信
  safety_margin: 1.20         # 排产总预算的安全系数；--deadline 判断"来不来得及"时也乘它

# -----------------------------------------------------------------------------
# 目录约定（scheduler / runner / report 共用）
# -----------------------------------------------------------------------------
paths:
  tslib_root: third_party/tslib
  data_root: data
  runs_dir: runs                       # runs/<cell_id>/{cmd.json,log.txt,epochs.jsonl,checkpoint.pth}
  cells_dir: results/cells             # results/cells/<cell_id>.json  (存在即视为已完成)
  results_csv: results/results.csv     # 聚合结果（原子替换写入）
  speed_csv: results/speed.csv         # 1-epoch 实测速度
  winerr_dir: results/winerr           # results/winerr/<cell_id>.npy  逐窗口测试 MSE（phase-2）
  features_csv: artifacts/features.csv
  artifacts_dir: artifacts
