  data_root: data
  runs_dir: runs_p2
  cells_dir: results/p2/cells
  results_csv: results/p2/results.csv
  speed_csv: results/speed.csv
  winerr_dir: results/p2/winerr
  features_csv: artifacts/p2/features.csv
  artifacts_dir: artifacts/p2
deviations:
  phase2_window_level:
    what: 重跑 1-seed 全网格，额外落盘 best epoch 的逐窗口测试 MSE
    why: phase-1 的特征只有 8 个互异取值（每数据集一份，horizon 间相同），LODO selector 准确率 0.381 低于多数类基线
      0.405，permutation importance 全为 0；这是决策粒度问题而非模型问题
    how: scheduler --run --save-window-mse，逐格写 results/p2/winerr/<cell_id>.npy；TSLib
      的 test loader shuffle=False，故不同格子的第 i 项严格对应同一个测试窗口，可按下标做配对比较
    cost: 428 格 / 81.0 GPU 小时；升序排产下前三个骨干约 5.6 GPU 小时即可先验证链路
