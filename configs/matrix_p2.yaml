skip_rules:
- id: revin_on_internal_norm_backbones
  plugin: revin
  backbone_internal_norm: hardcoded
  reason: 骨干已内含同款实例归一化，外挂 RevIN 数学上退化为 no-op（见 deviations.internal_norm_is_hardcoded）
  keep_verification_subset:
    datasets:
    - ETTh1
    - Weather
    horizons:
    - 96
    - 720
    seeds:
    - 2021
seed_policy:
  base_seeds:
  - 2021
  extra_seeds:
  - 2022
  - 2023
  tiers_with_extra_seeds: []
  note: phase-2 全矩阵仅 seed=2021。逐窗口门控的 N 来自测试窗口数（万级），不再依赖多 seed 撑样本量；但块级 MSE 的 seed
    方差因此不可估计，论文里所有块级数字一律引用 phase-1 的 3-seed 结果。
cost_model:
  device: V100-32GB (fp32; AMP=fp16)
  anchor: VarDrop@RTX3090 ms/iter × 2.0 保守折算 + iTransformer@P100 全基准可跑的存在性证据
  dataset_base_ms:
    ETTh1: 25.0
    ETTh2: 25.0
    ETTm1: 25.0
    ETTm2: 25.0
    Weather: 40.0
    Electricity: 82.0
    Exchange: 20.0
    ILI: 15.0
    Traffic: 400.0
  amp_speedup: 0.75
  expected_epochs: 8.0
  eval_overhead: 2.22
  probe_min_iters: 30
  safety_margin: 1.2
paths:
