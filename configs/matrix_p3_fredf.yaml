deviations:
  fredf_fairness:
    what: α 扫描（plain [0.1, 0.3, 0.7, 0.9] / √H 归一化 [0.1, 0.5, 0.9]）× 3 个骨干 × 8 数据集
      × 4 horizon
    why: FreDF 官方脚本逐 (数据集,骨干) 配置 α ∈ [0.0, 0.9]，其中 ECL×PatchTST 配成 0（等于关闭）。若只报告固定
      α=0.5 的结果，会被判定为 straw man。本组给出『调参能挽回多少』的上界，并检验 √H 归一化能否让单一 α 跨 horizon 可用。
    how: 同 phase-2 协议（1 seed，落盘逐窗口 val/test 误差），产物写 results/p3/
    note: 不含 TimesNet：FreDF 是损失插件，α–H 量纲问题与骨干无关；TimesNet×α=0.5 已在 phase-1 有对照。
