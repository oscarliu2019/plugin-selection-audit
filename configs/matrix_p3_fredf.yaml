seed_policy:
  base_seeds:
  - 2021
  extra_seeds: []
  tiers_with_extra_seeds: []
  note: FreDF 公平性组只跑 seed=2021；结论靠 α 网格与 horizon 配对，不靠多 seed。
cost_model:
  device: V100-32GB (fp32; AMP=fp16)
  anchor: VarDrop@RTX3090 ms/iter × 2.0 保守折算 + iTransformer@P100 全基准可跑的存在性证据
  dataset_base_ms:
    ETTh1: 25.0
    ETTh2: 25.0
    ETTm1: 25.0
    ETTm2: 25.0
    Weather: 40.0
    Electricity: 82.0
    Exchange: 20.0
    ILI: 15.0
